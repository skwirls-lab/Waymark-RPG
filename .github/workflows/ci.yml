name: Verify and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'archive/**'
      - 'sources/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/786714793025/locations/global/workloadIdentityPools/github/providers/waymark-rpg
          service_account: github-deploy@waymark-rpg.iam.gserviceaccount.com
      - name: Deploy the rules site
        run: npx firebase deploy --only hosting:site --project waymark-rpg --non-interactive
      - name: Deploy the app and the security rules
        run: npx firebase deploy --only hosting:app,firestore:rules --project waymark-rpg --non-interactive
      - name: Deploy the Cloud Functions
        run: npx firebase deploy --only functions --project waymark-rpg --non-interactive --force
      - name: Check that both are up
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://waymark-rpg.web.app/ | grep -q "Waymark"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://waymark-rpg-app.web.app/ | grep -q "Waymark"
          curl --fail --silent --show-error https://waymark-rpg.web.app/pagefind/pagefind.js > /dev/null
      - name: Check that a guest can really sign in on the deployed app
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.live.config.ts
      - name: If the live check failed, show what the functions answer
        if: failure()
        run: |
          set +e
          for fn in createCampaign exportMyData; do
            echo "== OPTIONS $fn"
            curl -s -i -X OPTIONS "https://us-central1-waymark-rpg.cloudfunctions.net/$fn" -H "Origin: https://waymark-rpg-app.web.app" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,authorization" | head -20
            echo "== POST $fn"
            curl -s -i -X POST "https://us-central1-waymark-rpg.cloudfunctions.net/$fn" -H "Content-Type: application/json" -d '{"data":{}}' | head -20
          done
          echo "== Who may call createCampaign"
          gcloud run services get-iam-policy createcampaign --region us-central1 --project waymark-rpg
          echo "== Recent log lines"
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="createcampaign"' --project waymark-rpg --limit 15 --format='value(severity,textPayload,httpRequest.status)'
      - name: Check the app's speed and accessibility on a phone profile
        run: node scripts/check-lighthouse.mjs https://waymark-rpg-app.web.app/

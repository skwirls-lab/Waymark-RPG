name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Waymark-Rulebook.md'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/786714793025/locations/global/workloadIdentityPools/github/providers/waymark-rpg
          service_account: github-deploy@waymark-rpg.iam.gserviceaccount.com
      - run: npx --yes firebase-tools@13 deploy --only hosting --project waymark-rpg --non-interactive
